<!doctype html>
<html lang="ru"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#02050a"><title>GoodiGoo Rush v0.7</title>
<link rel="stylesheet" href="style.css?v=7"><script src="https://telegram.org/js/telegram-web-app.js"></script></head>
<body><div id="app">

<section id="home" class="screen active">
  <div class="art-shell home-art">
    <img src="assets/home_ui.webp?v=7" alt="">
    <div class="hud-mask xp-mask"><small>LVL <i id="lvl">1</i></small><b><i id="xp">0</i> / 250 XP</b><div><span id="xpbar"></span></div></div>
    <div class="hud-mask coin-mask"><b>G <i id="coins">350</i></b></div>
    <div class="stat-mask best-mask"><small>РЕКОРД</small><b><i id="best">0</i> м</b></div>
    <div class="stat-mask runs-mask"><small>ЗАБЕГОВ</small><b id="runs">0</b></div>

    <button class="hit play-hit" id="playBtn" aria-label="Начать забег"></button>
    <button class="hit profile-hit" data-screen="profile"></button>
    <button class="hit rating-hit" data-screen="rating"></button>
    <button class="hit shop-hit" data-screen="shop"></button>
    <button class="hit inventory-hit" data-screen="inventory"></button>
    <button class="hit ach-hit" data-screen="achievements"></button>
    <button class="hit missions-hit" data-screen="missions"></button>
    <button class="hit settings-hit" data-screen="settings"></button>
  </div>
</section>

<section id="game" class="screen">
  <div class="game-wrap">
    <img class="game-art" src="assets/game_ui.webp?v=7" alt="">
    <div class="game-top distance-live"><b><i id="meters">0</i> м</b></div>
    <div class="game-top coins-live"><b>G <i id="runCoins">0</i></b></div>
    <button id="pauseBtn" class="pause-hit">Ⅱ</button>
    <div class="lane-layer">
      <div id="runner" class="runner"></div>
      <div id="coinField"></div>
      <div id="obstacleField"></div>
    </div>
    <div class="mission-live">МИССИЯ <b id="mission">0/5</b></div>
  </div>
</section>

<section id="result" class="screen page">
 <div class="head"><button data-screen="home">←</button><h2>РЕЗУЛЬТАТ</h2></div>
 <div class="panel result"><div class="round">G</div><h2 id="resultTitle">ЗАБЕГ ОКОНЧЕН</h2>
 <div class="big"><b id="resultMeters">0</b><small>МЕТРОВ</small></div>
 <div class="twocol"><div><small>GOODICOIN</small><b>G <i id="resultCoins">0</i></b></div><div><small>XP</small><b>+<i id="resultXp">0</i></b></div></div>
 <div id="missionResult" class="missionResult">МИССИЯ</div><button id="claimBtn" class="primary">ЗАБРАТЬ НАГРАДУ</button><button id="againBtn" class="secondary">ЕЩЁ РАЗ</button></div>
</section>

<section id="profile" class="screen page"></section><section id="rating" class="screen page"></section>
<section id="shop" class="screen page"></section><section id="inventory" class="screen page"></section>
<section id="achievements" class="screen page"></section><section id="missions" class="screen page"></section>
<section id="settings" class="screen page"></section>
</div><div id="toast"></div><script src="game.js?v=7"></script></body></html>
